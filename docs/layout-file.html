<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Layout file editor · RoboSynct</title>
<script src="./theme-init.js"></script><link rel="stylesheet" href="./themes.css"><link rel="stylesheet" href="./layout-file.css?v=0.37.0"><script type="module" src="./layout-file-editor.js?v=0.37.0"></script></head>
<body><header><a class="brand" href="./"><b aria-hidden="true">R</b> RoboSynct</a><a href="./studio.html">Dashboard Studio</a></header><main>
<h1>Layout file editor</h1><p id="intro">Open a layout exported from Dashboard Studio. Edits stay in the file until the owner applies them.</p>
<div class="bar"><label class="file-button">Open layout<input id="file" type="file" accept=".json,application/json"></label><button id="download" disabled>Download edited layout</button></div>
<p id="status" role="status" aria-live="polite"></p>
<section id="work" hidden><div><h2>Cards</h2><ul id="cards" aria-label="Select a card"></ul></div>
<form id="edit"><h2>Card settings</h2><label>Title<input id="title" maxlength="120" required></label>
<label>Shared grid width<select id="columns"></select></label><label>Theme<select id="theme"></select></label><label>Icon<select id="icon"></select></label>
<div class="bar"><button type="button" id="up">Move up</button><button type="button" id="down">Move down</button></div><button class="primary">Apply to file</button></form></section>
</main></body></html>
